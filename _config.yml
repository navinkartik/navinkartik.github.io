# Jekyll configuration for Navin Kartik's academic website
# GitHub Pages automatically builds this site with Jekyll

title: Navin Kartik
description: A. Douglas Melamed Professor of Economics, Yale University
url: https://navinkartik.com

# Build settings
markdown: kramdown

# jekyll-sitemap generates sitemap.xml (and a robots.txt pointing at it), so
# search engines find the individual paper pages, not just the home page.
# Supported natively by GitHub Pages; no Gemfile or Actions workflow needed.
plugins:
  - jekyll-sitemap

# Exclude files from processing
exclude:
  - build.py
  - papers.yaml
  - coauthors.yaml
  - BUILD_INSTRUCTIONS.txt
  - README.md
  - Gemfile
  - Gemfile.lock
  # Superseded pages kept in the repo as backups: not built, so not published
  # at a URL and not crawlable.
  - index_old.html
  - index-old.md
  - Old/
  # Personal, not part of the professional site.
  - Ajay/
